name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

# Required for Azure OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:

  # =========================================================
  # TERRAFORM PLAN
  # =========================================================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environment/dev

    env:
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Terraform Setup
      # -----------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -----------------------------------------------------
      # Azure Login using OIDC
      # -----------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------
      # Verify Azure Login
      # -----------------------------------------------------
      - name: Check Azure Login
        run: az account show

      # -----------------------------------------------------
      # Terraform Format Check
      # -----------------------------------------------------
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # -----------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -----------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -----------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------
      - name: Terraform Plan
        run: terraform plan


  # =========================================================
  # TERRAFORM APPLY
  # =========================================================
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: environment/dev

    env:
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # Terraform Setup
      # -----------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -----------------------------------------------------
      # Azure Login using OIDC
      # -----------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------
      # Verify Azure Login
      # -----------------------------------------------------
      - name: Check Azure Login
        run: az account show

      # -----------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------
      - name: Terraform Init
        run: terraform init

      # -----------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # -----------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # -----------------------------------------------------
      # Terraform Apply
      # -----------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
